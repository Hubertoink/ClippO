name: Windows installer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build installer
        id: compile
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./scripts/desktop.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { 'signed=true' >> $env:GITHUB_OUTPUT }
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Exercise Windows file drops and teardrop mode
        run: |
          python -m pip install playwright
          python scripts/smoke-windows-drop.py src-tauri/target/release/clippo.exe
      - name: Package release
        run: ./scripts/package-release.ps1 -Signed:('${{ steps.compile.outputs.signed }}' -eq 'true')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            release/*-setup.exe
            release/*-portable.zip
            release/*.sig
            release/latest.json
          if-no-files-found: error
          compression-level: 0
