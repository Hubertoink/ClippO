[package]
name = "clippo"
version = "0.5.0"
edition = "2021"
authors = ["Hubertoink <Hubertoink@users.noreply.github.com>"]
description = "Floating image and PDF compressor for Windows and Linux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
oxipng = { version = "10", default-features = false, features = ["parallel"] }
mozjpeg = { version = "0.10", default-features = false }
webp = { version = "0.3", default-features = false }
arboard = "3"
notify = "8"
tempfile = "3"
directories = "6"
lopdf = { version = "0.38", default-features = false }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
